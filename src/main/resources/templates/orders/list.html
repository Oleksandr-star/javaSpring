<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Замовлення</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Онлайн-барахолка</a>
            <div class="navbar-nav">
                <a class="nav-link" th:href="@{/items}">Товари</a>
                <a class="nav-link" th:href="@{/orders}">Замовлення</a>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-link nav-link">Вийти</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="card shadow">
        <div class="card-header bg-info text-white">
            <h4>Список замовлень</h4>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID товару</th>
                    <th>Покупець</th>
                    <th>Дата</th>
                    <th>Статус</th>
                    <th sec:authorize="hasRole('ADMIN')">Дії</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.itemId}"></td>
                    <td th:text="${order.buyerId}"></td>
                    <td th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
                    <td th:text="${order.status}"></td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <form th:action="@{/orders/{id}/delete(id=${order.id})}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <button type="submit" class="btn btn-danger btn-sm">Видалити</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
