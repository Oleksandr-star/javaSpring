<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Додати товар</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 600px;">
    <div class="card shadow">
        <div class="card-header bg-success text-white text-center">
            <h3>Додати новий товар</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/items}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="mb-3">
                    <label class="form-label" for="title">Назва:</label>
                    <input type="text" id="title" name="title" class="form-control" required placeholder="Введіть назву товару">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="description">Опис:</label>
                    <textarea id="description" name="description" class="form-control" rows="3" placeholder="Опишіть товар"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="price">Ціна:</label>
                    <input type="number" step="0.01" min="0" id="price" name="price" class="form-control" required placeholder="0.00">
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">Зберегти</button>
                    <a th:href="@{/items}" class="btn btn-outline-secondary">Скасувати</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
