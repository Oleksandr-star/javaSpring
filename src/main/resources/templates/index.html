<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Онлайн-Барахолка — Головна</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Онлайн-Барахолка</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Перемикач навігації">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link active" href="#">Головна</a></li>
                <li class="nav-item"><a class="nav-link" href="/items">Товари</a></li>
                <li class="nav-item"><a class="nav-link" href="/orders">Замовлення</a></li>
                <li class="nav-item"><a class="nav-link" href="/profile">Профіль</a></li>
                <li class="nav-item"><a class="nav-link" href="/logout">Вийти</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Популярні товари</h2>
    <div class="table-responsive">
        <table class="table table-striped" id="productTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Назва</th>
                <th>Категорія</th>
                <th>Опис</th>
                <th>Ціна</th>
                <th>Наявність</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <h2 class="mt-5">Продавці</h2>
    <div class="table-responsive">
        <table class="table table-striped" id="sellersTable">
            <thead>
            <tr>
                <th>ID</th>
                <th>Ім'я</th>
                <th>Вік</th>
                <th>Рейтинг</th>
            </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>
</div>

<script>
    async function loadProducts() {
        try {
            const response = await fetch('/api/products');
            if (!response.ok) throw new Error('Помилка завантаження товарів');
            const products = await response.json();
            const tbody = document.querySelector('#productTable tbody');
            tbody.innerHTML = '';

            products.forEach(product => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${product.id}</td>
                    <td>${product.name}</td>
                    <td>${product.category}</td>
                    <td>${product.description}</td>
                    <td>${product.price.toFixed(2)} ₴</td>
                    <td>${product.stock}</td>
                `;
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error(err);
        }
    }

    // Завантаження продавців
    async function loadSellers() {
        try {
            const response = await fetch('/api/sellers/list');
            if (!response.ok) throw new Error('Помилка завантаження продавців');
            const sellers = await response.json();
            const tbody = document.querySelector('#sellersTable tbody');
            tbody.innerHTML = '';

            sellers.forEach(seller => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${seller.id}</td>
                    <td>${seller.fullName}</td>
                    <td>${seller.age}</td>
                    <td>${seller.rating.toFixed(1)}</td>
                `;
                tbody.appendChild(row);
            });
        } catch (err) {
            console.error(err);
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        loadProducts();
        loadSellers();
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
